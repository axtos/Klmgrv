[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadequant"
version = "0.1.0"
description = "Log-Poisson energy cascade analytics for turbulence and financial volatility"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AxiomBlack Research", email = "research@axiomblack.com"}]
keywords = ["turbulence", "cascade", "volatility", "options", "multifractal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
examples = ["pandas>=2.0", "yfinance>=0.2"]

[project.urls]
Homepage = "https://axiomblack.com"
Repository = "https://github.com/axtos/klmgrv"

[tool.setuptools.packages.find]
where = ["."]
include = ["cascadequant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
